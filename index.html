<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Події Kyiv Media Hub</title>
<meta name="description" content="Календар подій Kyiv Media Hub: воркшопи, тренінги й зустрічі для журналістів і медійників.">
<meta property="og:title" content="Події Kyiv Media Hub">
<meta property="og:description" content="Календар подій і реєстрація">
<style>
  html, body { margin: 0; height: 100%; background: #f4efe6; }
  iframe { display: block; border: 0; width: 100%; height: 100vh; height: 100dvh; }
  .fallback { position: fixed; inset: auto 0 0 0; padding: 10px 16px; font: 14px/1.4 system-ui, sans-serif;
    background: #111; color: #fff; text-align: center; display: none; }
  .fallback a { color: #f2d43d; }
</style>
</head>
<body>
<!-- credentialless: календар вантажиться без cookie Google, як в інкогніто.
     Так Google не підставляє /u/1/ людям, які ввійшли в кілька акаунтів. -->
<iframe id="app" credentialless
  src="https://script.google.com/macros/s/AKfycbwMhdgaz3oz9_vJONUGLl972NymnlZU9DLmv3SCZa6rDgdYl7zeLQaiL_m5_-7xWMV9/exec"
  title="Календар подій Kyiv Media Hub" allow="clipboard-write"></iframe>
<div class="fallback" id="fb">Календар не завантажився? <a href="https://script.google.com/macros/s/AKfycbwMhdgaz3oz9_vJONUGLl972NymnlZU9DLmv3SCZa6rDgdYl7zeLQaiL_m5_-7xWMV9/exec" target="_blank" rel="noopener">Відкрити напряму</a></div>
<script>
  // kmh-events/#room відкриває одразу вкладку бронювання переговорної.
  if (/^#(room|kimnata|booking)$/i.test(location.hash)) {
    var f = document.getElementById('app');
    f.src = f.src + '?tab=room';
    document.title = 'Бронювання переговорної · Kyiv Media Hub';
  }
  var loaded = false;
  document.getElementById('app').addEventListener('load', function () { loaded = true; });
  setTimeout(function () { if (!loaded) document.getElementById('fb').style.display = 'block'; }, 12000);
</script>
</body>
</html>
